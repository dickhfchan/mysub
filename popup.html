<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MySub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header id="header">
    <div id="header-left">
      <span id="app-title">MySub</span>
      <div id="last-updated"></div>
    </div>
    <button id="refresh-btn">Refresh</button>
  </header>

  <div id="status-line"></div>

  <main>
    <div id="downloads-section" style="display:none">
      <div id="downloads-header">Downloads</div>
      <div id="downloads-list"></div>
    </div>
    <div id="video-list"></div>
    <div id="empty-state">
      <div class="empty-title">No videos yet</div>
      <div class="empty-desc">
        Visit your
        <button id="subs-link" class="link-btn">subscriptions feed</button>
        to load your channels.
      </div>
    </div>
  </main>

  <footer id="settings-footer">
    <div id="settings-row">
      <label for="threshold-select">NEW badge</label>
      <select id="threshold-select">
        <option value="12">12 hours</option>
        <option value="24">24 hours</option>
        <option value="48">48 hours</option>
        <option value="168">7 days</option>
      </select>
      <button id="clear-btn">Clear data</button>
      <span id="ext-id" class="ext-id" title="Click to copy — needed for install.sh"></span>
    </div>
    <div id="config-row">
      <a id="config-url" class="config-url" target="_blank" title="Open WeTube">—</a>
      <span class="sep">·</span>
      <span id="config-max-mb" class="config-badge" title="Max upload size">—</span>
      <span class="sep">·</span>
      <span id="config-uploader" class="config-badge" title="Uploader status">—</span>
    </div>
  </footer>

  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
